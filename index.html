<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروژه هکر</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>پروژه هکر</h1>
        <button id="theme-switcher-btn">تغییر تم</button>
        <p>یک شبیه‌ساز هک برای مبتدیان</p>
    </header>

    <main id="app">
        <section id="challenge-list-container">
            <h2>چالش‌ها</h2>
            <ul id="challenge-list">
                <!-- چالش‌ها به صورت پویا در اینجا قرار می‌گیرند -->
            </ul>
        </section>
        <section id="challenge-view-container">
            <h2 id="challenge-title">عنوان چالش</h2>
            <p id="challenge-description">توضیحات چالش در اینجا نمایش داده می‌شود.</p>
            <p id="challenge-hint"></p>
            <div id="challenge-input">
                <input type="text" id="flag-input" placeholder="پرچم را اینجا وارد کنید...">
                <button id="submit-flag-btn">ارسال</button>
            </div>
            <p id="feedback"></p>
        </section>
    </main>

    <!-- HINT: پرچم برای چالش اول اینجاست! flag{خوش_آمدی_هکر} -->

    <footer>
        <p>ساخته شده توسط جولز</p>
    </footer>

    <!-- Tutorial Modal -->
    <div id="tutorial-modal" class="modal hidden">
        <div class="modal-content">
            <button id="modal-close-btn" class="modal-close">&times;</button>
            <h2 id="tutorial-title"></h2>
            <div id="tutorial-body">
                <!-- Tutorial content will be injected here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
