<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}پلتفرم آموزش هک{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h1 class="sidebar-title">HACKER_PLATFORM</h1>
            <nav class="sidebar-nav">
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('profile') }}">پروفایل</a>
                    <a href="{{ url_for('tutorials', category='Beginner') }}">مقدماتی</a>
                    <a href="{{ url_for('tutorials', category='Intermediate') }}">متوسط</a>
                    <a href="{{ url_for('tutorials', category='Advanced') }}">پیشرفته</a>
                    <a href="{{ url_for('logout') }}">خروج</a>
                {% else %}
                    <a href="{{ url_for('login') }}">ورود</a>
                    <a href="{{ url_for('register') }}">ثبت‌نام</a>
                {% endif %}
            </nav>
        </aside>
        <main class="main-content">
            {% include '_flashes.html' %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
